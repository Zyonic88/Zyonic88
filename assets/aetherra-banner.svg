<pattern id="weave" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V24 M12 0V24" stroke="#8fc9ff" stroke-opacity=".055" stroke-width="5"/></pattern>
