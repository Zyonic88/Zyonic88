<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Aetherra Labs — Research, Develop, Create, Evolve</title>
<desc id="desc">Futuristic Aetherra Labs banner in deep crystal blue and midnight violet with a geometric A emblem, subtle carbon-fiber pattern and glowing horizon.</desc>
<defs>
